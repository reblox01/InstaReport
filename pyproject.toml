[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insta-report"
version = "0.1.0"
description = "Reliable Instagram fraud-report delivery with a Playwright browser channel and gated API fallback."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "httpx>=0.27",
    "rich>=13.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
insta-report = "insta_report.cli:main"

[tool.setuptools.packages.find]
include = ["insta_report*"]

[tool.setuptools.package-data]
insta_report = ["data/*.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:insta_report.*"]
